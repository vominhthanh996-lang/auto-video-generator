<div class="grid"><figure><img src='assets/scene-001.png'><figcaption>001. Không ai muốn xuyên không đến mạt thế. Ít nhất, Lâm Tịch chưa từng muốn.</figcaption></figure>
<figure><img src='assets/scene-002.png'><figcaption>002. Ở những tiểu thuyết nàng từng đọc, nữ chính xuyên qua thường có bàn tay vàng, có không gian linh tuyền, có dị năng nghịch thiên, hoặc ít nhất cũng được sống trong căn cứ an toàn có</figcaption></figure>
<figure><img src='assets/scene-003.png'><figcaption>003. Nhưng nơi nàng đến lại là một vùng phế thổ đã mục nát sau Đại Nhiễm Xạ. Đất bị ô nhiễm. Nước bị ô nhiễm. Không khí cũng bị ô nhiễm.</figcaption></figure>
<figure><img src='assets/scene-004.png'><figcaption>004. Thức ăn quá hạn có thể giết người. Một cơn mưa đen có thể khiến da thịt thối rữa. Động vật biến dị săn người như săn thịt.</figcaption></figure>
<figure><img src='assets/scene-005.png'><figcaption>005. Mà đáng sợ hơn quái vật, thường lại là lòng người. Ở nơi này, không có pháp luật. Chỉ có kẻ sống sót và người chết. Nàng không có dị năng.</figcaption></figure>
<figure><img src='assets/scene-006.png'><figcaption>006. Không có hệ thống. Không có không gian tích trữ vật tư.</figcaption></figure>
<figure><img src='assets/scene-007.png'><figcaption>007. Thứ duy nhất nàng có là một thân thể gầy yếu sắp chết vì nhiễm xạ và ký ức của một cô gái nhặt rác ngoài thành.</figcaption></figure>
<figure><img src='assets/scene-008.png'><figcaption>008. Sau này, bên cạnh nàng sẽ xuất hiện một người đàn ông tên Tần Dã. Hắn cũng không phải thiên tài được trời chọn. Không dị năng. Không huyết mạch đặc biệt.</figcaption></figure>
<figure><img src='assets/scene-009.png'><figcaption>009. Không quyền thế. Hai con người bị phế thổ nghiền ép đến mức gần như không còn đường lui, chỉ có thể dựa vào nhau mà sống.</figcaption></figure>
<figure><img src='assets/scene-010.png'><figcaption>010. Bọn họ sẽ vì một lon thịt hộp mà liều mạng. Vì nửa bình nước sạch mà canh chừng cả đêm.</figcaption></figure>
<figure><img src='assets/scene-011.png'><figcaption>011. Sẽ chui vào đống đổ nát nhặt từng mẩu vật tư còn dùng được, tránh né thú biến dị, đề phòng những kẻ săn người ngoài hoang khu.</figcaption></figure>
<figure><img src='assets/scene-012.png'><figcaption>012. Ở thế giới này, sống thêm một ngày đã là thắng lợi xa xỉ. Phần 1: Hộp Thịt Trong Túi Người Chết. Chương 1: Cô Đã Chết Một Lần.</figcaption></figure>
<figure><img src='assets/scene-013.png'><figcaption>013. Trước khi mở mắt, Lâm Tịch đã ngửi thấy mùi thối. Không phải mùi rác bình thường.</figcaption></figure>
<figure><img src='assets/scene-014.png'><figcaption>014. Là mùi máu khô, mùi nhựa cháy, mùi kim loại gỉ bị mưa độc ngâm qua nhiều năm, và một mùi chua ngọt rất nhạt giống trái cây hỏng.</figcaption></figure>
<figure><img src='assets/scene-015.png'><figcaption>015. Thứ mùi ấy chui vào cổ họng nàng, bám lên lưỡi, trườn xuống phổi. Chỉ hít một hơi, nàng đã ho đến mức tưởng như tim gan cũng bị kéo ra ngoài.</figcaption></figure>
<figure><img src='assets/scene-016.png'><figcaption>016. Nàng mở mắt. Bầu trời màu đỏ. Không phải đỏ của hoàng hôn, cũng không phải đỏ của đèn thành phố xuyên qua rèm cửa.</figcaption></figure>
<figure><img src='assets/scene-017.png'><figcaption>017. Đó là một màu đỏ đục, nặng nề, như có ai nghiền gạch vụn, tro than và máu khô rồi bôi lên cả vòm trời. Lâm Tịch nằm trong một đống rác.</figcaption></figure>
<figure><img src='assets/scene-018.png'><figcaption>018. Bên trái là nửa cái tủ lạnh rỉ sét. Bên phải là mấy túi nhựa đã cứng lại như da chết.</figcaption></figure>
<figure><img src='assets/scene-019.png'><figcaption>019. Dưới lưng nàng có thứ gì đó sắc nhọn cấn vào xương, đau đến mức nàng vừa cử động đã hít ngược một hơi. Khoan. Đau? Nàng còn biết đau?</figcaption></figure>
<figure><img src='assets/scene-020.png'><figcaption>020. Lâm Tịch nhớ rất rõ, mình đã chết.</figcaption></figure>
<figure><img src='assets/scene-021.png'><figcaption>021. Ở thế giới cũ, nàng không sống trong phế thổ, không biết tinh thạch là gì, càng chưa từng thấy bầu trời đỏ như thế này.</figcaption></figure>
<figure><img src='assets/scene-022.png'><figcaption>022. Nàng chỉ là một người bình thường, tan làm muộn, đứng ở vạch sang đường, nghe thấy tiếng phanh xe chói tai, sau đó cả thế giới lật úp.</figcaption></figure>
<figure><img src='assets/scene-023.png'><figcaption>023. Khoảnh khắc cuối cùng, nàng thấy ánh đèn xe trắng lóa. Vậy mà bây giờ, nàng tỉnh lại trong một đống rác.</figcaption></figure>
<figure><img src='assets/scene-024.png'><figcaption>024. Trong một thân thể gầy đến mức cổ tay như cành khô.</figcaption></figure>
<figure><img src='assets/scene-025.png'><figcaption>025. Trong cổ họng khô nứt, trong bụng đói quặn, trong làn da nổi đầy những vệt đen nhỏ như bụi than thấm dưới da.</figcaption></figure>
<figure><img src='assets/scene-026.png'><figcaption>026. Một đoạn ký ức không thuộc về nàng đột nhiên đập vào đầu. Khu 17. Ngoài thành. Đại Nhiễm Xạ. Đồ ăn không được ăn bừa. Nước không được uống bừa.</figcaption></figure>
<figure><img src='assets/scene-027.png'><figcaption>027. Mưa màu đen phải trốn. Thấy người chết không được khóc, phải xem trên người họ còn gì dùng được. Và cái tên của thân thể này. Cũng là Lâm Tịch.</figcaption></figure>
<figure><img src='assets/scene-028.png'><figcaption>028. Cô gái này mười sáu tuổi, sống bằng nghề nhặt rác. Cha chết trong một trận mưa đen. Mẹ chết vì sốt phóng xạ.</figcaption></figure>
<figure><img src='assets/scene-029.png'><figcaption>029. Ba ngày trước, nàng ta ăn nửa miếng bánh dinh dưỡng đã mốc vì quá đói. Tối qua lại uống nước chưa lọc trong một cái lon rỉ.</figcaption></figure>
<figure><img src='assets/scene-030.png'><figcaption>030. Nửa đêm phát sốt, bò ra bãi rác tìm than lọc độc, cuối cùng ngã xuống ở đây. Chết rồi. Thân thể này thật sự đã chết rồi.</figcaption></figure>
<figure><img src='assets/scene-031.png'><figcaption>031. Lâm Tịch nằm trong đống rác, một tay ôm cổ họng, một tay bấm vào ngực mình. Tim vẫn đập. Yếu, nhanh, loạn.</figcaption></figure>
<figure><img src='assets/scene-032.png'><figcaption>032. Như một con chim nhỏ bị nhốt trong lồng sắt, vừa sống lại đã biết cái lồng này sắp gỉ thủng. Nàng vừa xuyên không. Nhưng không xuyên thành công chúa.</figcaption></figure>
<figure><img src='assets/scene-033.png'><figcaption>033. Không xuyên thành thiên kim. Không xuyên thành đại tiểu thư có thù nhà phải báo.</figcaption></figure>
<figure><img src='assets/scene-034.png'><figcaption>034. Nàng xuyên vào xác một cô gái nhặt rác vừa chết vì nhiễm phóng xạ và đói khát. Nếu đây là may mắn, vậy ông trời chắc hẳn rất biết cách nói đùa.</figcaption></figure>
<figure><img src='assets/scene-035.png'><figcaption>035. Lâm Tịch chống tay muốn ngồi dậy. Cơ thể lập tức phản đối. Đầu choáng, mắt tối, bụng đau, cổ họng khô đến mức mỗi hơi thở đều như nuốt cát.</figcaption></figure>
<figure><img src='assets/scene-036.png'><figcaption>036. Nàng cúi đầu nhìn bàn tay mình. Móng tay bẩn, đầu ngón tay nứt toác, lòng bàn tay có vết chai mỏng do lâu ngày bới rác.</figcaption></figure>
<figure><img src='assets/scene-037.png'><figcaption>037. Trên cổ tay trái có một vết tím đen, giống như mạch máu bên dưới đã bị thứ gì đó nhuộm bẩn.</figcaption></figure>
<figure><img src='assets/scene-038.png'><figcaption>038. Ký ức của nguyên chủ nói cho nàng biết: đó là dấu nhiễm xạ nhẹ. Nhẹ. Nếu nặng thì người đã không tỉnh.</figcaption></figure>
<figure><img src='assets/scene-039.png'><figcaption>039. Lâm Tịch suýt bật cười, nhưng cổ họng chỉ phát ra một tiếng khàn khàn khó nghe. Được.</figcaption></figure>
<figure><img src='assets/scene-040.png'><figcaption>040. Còn sống đã là lời chào hỏi tử tế nhất mà thế giới này dành cho nàng. Nàng lục trong túi áo. Không có điện thoại. Không có ví. Không có hệ thống.</figcaption></figure>
<figure><img src='assets/scene-041.png'><figcaption>041. Không có âm thanh máy móc nào vang lên nói ký chủ thân mến.</figcaption></figure>
<figure><img src='assets/scene-042.png'><figcaption>042. Chỉ có một miếng vải bẩn, hai cái đinh gỉ, nửa viên than lọc độc đã dùng qua, và một mẩu bánh cứng như đá, bên mép mọc một lớp mốc xanh.</figcaption></figure>
<figure><img src='assets/scene-043.png'><figcaption>043. Ký ức của nguyên chủ gần như hét lên trong đầu nàng: cái này không ăn được.</figcaption></figure>
<figure><img src='assets/scene-044.png'><figcaption>044. Nhưng cái bụng của thân thể này lại co rút đến mức khiến tay nàng run lên. Lâm Tịch nhìn mẩu bánh rất lâu.</figcaption></figure>
<figure><img src='assets/scene-045.png'><figcaption>045. Ở thế giới cũ, thứ này ngay cả chó hoang chưa chắc đã ăn. Ở nơi này, nó có thể là bữa cuối cùng. Nàng không ăn. Không phải vì nàng kiên cường.</figcaption></figure>
<figure><img src='assets/scene-046.png'><figcaption>046. Mà vì trong ký ức của nguyên chủ có cảnh một người đàn ông ăn đúng loại mốc xanh này, ba giờ sau bắt đầu nôn ra máu đen, sáng hôm sau bụng phình lên như cái trống.</figcaption></figure>
<figure><img src='assets/scene-047.png'><figcaption>047. Lâm Tịch cất mẩu bánh lại. Sống. Trước tiên phải sống. Nàng vịn vào cái tủ lạnh rỉ sét đứng dậy. Gió đỏ thổi qua bãi rác, cuốn bụi vào mặt.</figcaption></figure>
<figure><img src='assets/scene-048.png'><figcaption>048. Nàng nheo mắt, trong đầu hỗn loạn giữa hai đời ký ức. Một đời có đèn giao thông, thang máy, cơm hộp, nước đóng chai.</figcaption></figure>
<figure><img src='assets/scene-049.png'><figcaption>049. Một đời có phế thổ, phóng xạ, thành an toàn, tinh thạch và những người chết không ai chôn. Xa xa có một bức tường khổng lồ. Sau bức tường là thành.</figcaption></figure>
<figure><img src='assets/scene-050.png'><figcaption>050. Trong ký ức của nguyên chủ, đó là nơi có nước sạch, cơm trắng, bác sĩ gen, mái nhà không dột mưa độc.</figcaption></figure>
<figure><img src='assets/scene-051.png'><figcaption>051. Mục tiêu cả đời của cô gái đã chết kia rất đơn giản: gom đủ tinh thạch, mua một tấm vé vào thành.</figcaption></figure>
<figure><img src='assets/scene-052.png'><figcaption>052. Lâm Tịch nhìn bức tường ấy. Rất xa. Xa như đời trước của nàng. Nàng cúi đầu, nhặt một thanh sắt ngắn dưới chân.</figcaption></figure>
<figure><img src='assets/scene-053.png'><figcaption>053. Thanh sắt rất nhẹ, giòn, có lẽ đập mạnh vài cái sẽ gãy. Nhưng cầm nó trong tay, nàng vẫn thấy an tâm hơn một chút.</figcaption></figure>
<figure><img src='assets/scene-054.png'><figcaption>054. Đúng lúc đó, phía bên kia đống xe phế liệu truyền đến tiếng gầm gừ. Lâm Tịch lập tức cứng người. Không phải tiếng người.</figcaption></figure>
<figure><img src='assets/scene-055.png'><figcaption>055. Ký ức của nguyên chủ phản ứng nhanh hơn nàng. Chó hai hàm. Loài chó biến dị cấp Gỉ, hàm dưới tách đôi, răng mọc lệch, thích ăn xác mới chết.</figcaption></figure>
<figure><img src='assets/scene-056.png'><figcaption>056. Gặp một con thì trốn. Gặp cả bầy thì tốt nhất cầu cho mình chết nhanh. Lâm Tịch nín thở, chậm rãi cúi người sau một bức tường bê tông sập.</figcaption></figure>
<figure><img src='assets/scene-057.png'><figcaption>057. Cách nàng hơn hai mươi bước, ba con chó hai hàm đang cúi đầu xé một cái xác. Xác người.</figcaption></figure>
<figure><img src='assets/scene-058.png'><figcaption>058. Một người đàn ông mặc áo khoác chiến thuật màu đen, nửa người nhuốm máu, bên hông còn treo dao. Áo rất tốt. Giày cũng rất tốt.</figcaption></figure>
<figure><img src='assets/scene-059.png'><figcaption>059. Nếu vận khí khá hơn một chút, trong túi hắn có thể có thuốc kháng xạ. Nếu vận khí tốt hơn nữa, có thể có tinh thạch.</figcaption></figure>
<figure><img src='assets/scene-060.png'><figcaption>060. Nếu ông trời thật sự cảm thấy màn xuyên không vừa rồi chưa đủ trêu ngươi nàng, có lẽ sẽ có đồ ăn. Lâm Tịch nằm sau tường, không nhúc nhích.</figcaption></figure>
<figure><img src='assets/scene-061.png'><figcaption>061. Gió đỏ thổi qua tóc nàng, qua cổ áo rách, qua làn da vẫn còn sốt âm ỉ vì phóng xạ.</figcaption></figure>
<figure><img src='assets/scene-062.png'><figcaption>062. Cơ thể này yếu đến mức mỗi nhịp tim đều làm ngực đau, nhưng ký ức của nguyên chủ lại tỉnh táo đáng sợ. Đợi. Không được lao ra.</figcaption></figure>
<figure><img src='assets/scene-063.png'><figcaption>063. Phần lớn người chết ở phế thổ không chết vì không thấy cơ hội. Mà chết vì thấy cơ hội quá sớm. Ba con chó ăn rất lâu.</figcaption></figure>
<figure><img src='assets/scene-064.png'><figcaption>064. Đến khi chúng kéo nhau rời đi, Lâm Tịch vẫn đếm thêm một trăm nhịp thở. Sau một trăm nhịp, nàng lại đếm thêm năm mươi.</figcaption></figure>
<figure><img src='assets/scene-065.png'><figcaption>065. Rồi nàng mới bò ra khỏi bóng tường. Động tác rất nhẹ. Nhẹ đến mức giống như một mảnh giấy bị gió đẩy qua mặt đất.</figcaption></figure>
<figure><img src='assets/scene-066.png'><figcaption>066. Cái xác nằm nghiêng bên cạnh chiếc xe tải lật. Máu đã thấm xuống đất, nhưng chưa khô hết. Người này chết chưa lâu. Hoặc chưa chết. Lâm Tịch dừng lại.</figcaption></figure>
<figure><img src='assets/scene-067.png'><figcaption>067. Trong đầu nàng, phần ký ức hiện đại nói: cứu người. Phần ký ức phế thổ nói: trước tiên xem hắn có cắn mình không.</figcaption></figure>
<figure><img src='assets/scene-068.png'><figcaption>068. Nàng nắm chặt thanh sắt, chậm rãi đưa tay về phía túi áo bên trái của người đàn ông. Túi đó hơi phồng. Có thể là thuốc. Có thể là đạn.</figcaption></figure>
<figure><img src='assets/scene-069.png'><figcaption>069. Có thể là đồ ăn. Đầu ngón tay nàng vừa chạm vào mép túi, cổ tay bỗng bị nắm chặt. Lạnh. Cứng. Như bị một cái kìm sắt kẹp lấy.</figcaption></figure>
<figure><img src='assets/scene-070.png'><figcaption>070. Lâm Tịch toàn thân cứng đờ. Người đàn ông trên đất mở mắt.</figcaption></figure>
<figure><img src='assets/scene-071.png'><figcaption>071. Đó là một đôi mắt màu xám tro, sâu đến mức giống như đã từng nhìn thấy quá nhiều người chết, cuối cùng không còn thấy cái chết đáng sợ nữa.</figcaption></figure>
<figure><img src='assets/scene-072.png'><figcaption>072. Hắn nói rất khẽ: Đừng động túi bên trái. Lâm Tịch nhìn hắn. Trong đầu nàng chỉ có một ý nghĩ: Hay thật.</figcaption></figure>
<figure><img src='assets/scene-073.png'><figcaption>073. Mình vừa sống lại trong xác người chết, quay đầu đã gặp một cái xác cũng chưa chết hẳn. Thế giới này đúng là rất náo nhiệt. Nàng khàn giọng hỏi: Có bom?</figcaption></figure>
<figure><img src='assets/scene-074.png'><figcaption>074. Không. Có độc? Không. Vậy có gì? Người đàn ông im lặng một lúc. Máu từ khóe môi hắn chảy xuống cằm. Thịt hộp. Lâm Tịch ngừng thở. Thịt hộp.</figcaption></figure>
<figure><img src='assets/scene-075.png'><figcaption>075. Hai chữ ấy rơi vào đầu nàng còn mạnh hơn cả hai chữ xuyên không.</figcaption></figure>
