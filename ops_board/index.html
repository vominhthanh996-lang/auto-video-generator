<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Story Task Board</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181c22;
      --panel-2: #20262e;
      --text: #eef2f7;
      --muted: #9aa6b2;
      --line: #313843;
      --ok: #35c47c;
      --warn: #ffb547;
      --bad: #ff6868;
      --run: #57a6ff;
      --pending: #697586;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at top, #1b2330 0%, var(--bg) 38%);
      color: var(--text);
    }
    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .title h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
    }
    .title p {
      margin: 6px 0 0;
      color: var(--muted);
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 18px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.24);
    }
    .card h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
    }
    .card .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      word-break: break-word;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border: 1px solid transparent;
    }
    .pill.success { background: rgba(53,196,124,.14); color: var(--ok); border-color: rgba(53,196,124,.35); }
    .pill.running { background: rgba(87,166,255,.14); color: var(--run); border-color: rgba(87,166,255,.35); }
    .pill.warning { background: rgba(255,181,71,.14); color: var(--warn); border-color: rgba(255,181,71,.35); }
    .pill.failed { background: rgba(255,104,104,.14); color: var(--bad); border-color: rgba(255,104,104,.35); }
    .pill.queued, .pill.pending { background: rgba(105,117,134,.14); color: #c0c7d0; border-color: rgba(105,117,134,.35); }
    .counts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
    }
    .count {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .count .label { color: var(--muted); font-size: 12px; }
    .count .value { margin-top: 6px; font-size: 22px; font-weight: 700; }
    .flow {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .node {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      min-height: 92px;
      background: rgba(255,255,255,.02);
    }
    .node strong {
      display: block;
      font-size: 12px;
      margin-bottom: 8px;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .node .state {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .node .detail {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      word-break: break-word;
    }
    .node.success .state { color: var(--ok); }
    .node.running .state { color: var(--run); }
    .node.warning .state { color: var(--warn); }
    .node.failed .state { color: var(--bad); }
    .node.pending .state, .node.queued .state, .node.blocked .state, .node.skipped .state { color: #c0c7d0; }
    .detail-block {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      word-break: break-word;
    }
    .links a {
      color: #9fd2ff;
      text-decoration: none;
    }
    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 14px;
    }
    .btn {
      border: 1px solid rgba(87,166,255,.45);
      background: rgba(87,166,255,.12);
      color: #d6eaff;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.danger {
      border-color: rgba(255,104,104,.45);
      background: rgba(255,104,104,.12);
      color: #ffd6d6;
    }
    .btn.warn {
      border-color: rgba(255,181,71,.45);
      background: rgba(255,181,71,.12);
      color: #ffe2aa;
    }
    .btn:disabled {
      opacity: .6;
      cursor: wait;
    }
    .empty {
      padding: 32px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">
        <h1>Story Task Board</h1>
        <p>Operation board for storyboard, voice, image, render, and QA.</p>
      </div>
      <div class="meta" id="meta">Loading...</div>
    </div>
    <div id="board" class="grid"></div>
  </div>
  <script>
    const board = document.getElementById("board");
    const meta = document.getElementById("meta");

    function pillClass(value) {
      const v = (value || "").toLowerCase();
      if (["success", "done"].includes(v)) return "success";
      if (["running"].includes(v)) return "running";
      if (["warning"].includes(v)) return "warning";
      if (["failed", "error"].includes(v)) return "failed";
      if (["queued", "pending", "blocked", "skipped"].includes(v)) return v;
      return "pending";
    }

    function safe(value) {
      return value ? String(value) : "";
    }

    function renderFailDetails(details) {
      if (!Array.isArray(details) || !details.length) return "";
      const rows = details.slice(0, 25).map((item) => {
        const scene = safe(item.scene || item.index || "");
        const score = safe(item.score || item.percent || "");
        const reason = safe(item.reason || item.reasons || "");
        return `<div class="qa-fail-row"><strong>#${scene}${score ? ` (${score}%)` : ""}</strong>: ${reason}</div>`;
      }).join("");
      const more = details.length > 25 ? `<div class="qa-fail-row">...and ${details.length - 25} more fail detail(s) in the QA request file.</div>` : "";
      return `<div><strong>QA fail reasons:</strong>${rows}${more}</div>`;
    }

    function renderTask(task) {
      const nodes = task.nodes || {};
      const qaState = task.qa_request_state || {};
      const qaStatus = String(qaState.status || "").toLowerCase();
      const canRegen = ["failed", "fail"].includes(qaStatus);
      const entries = [
        ["storyboard", "Read Story"],
        ["voice", "Gen Audio"],
        ["images", "Gen Images"],
        ["render", "Render"],
        ["qa", "Check Output"]
      ];
      const flow = entries.map(([key, label]) => {
        const node = nodes[key] || { status: "pending", detail: "" };
        const cls = pillClass(node.status);
        return `
          <div class="node ${cls}">
            <strong>${label}</strong>
            <div class="state">${safe(node.status) || "pending"}</div>
            <div class="detail">${safe(node.detail)}</div>
          </div>
        `;
      }).join("");

      return `
        <section class="card">
          <h2>${safe(task.task)}</h2>
          <div class="subtitle">${safe(task.source || task.storyboard || task.project)}</div>
          <div class="pill ${pillClass(task.overall)}">${safe(task.overall || "queued")}</div>
          <div class="counts">
            <div class="count"><div class="label">Scenes</div><div class="value">${safe(task.counts?.scenes ?? 0)}</div></div>
            <div class="count"><div class="label">Images</div><div class="value">${safe(task.counts?.images ?? 0)}</div></div>
            <div class="count"><div class="label">Audio</div><div class="value">${safe(task.counts?.audio ?? 0)}</div></div>
          </div>
          <div class="flow">${flow}</div>
          <div class="detail-block">
            <div><strong>Current:</strong> ${safe(task.current_node)}</div>
            <div><strong>Message:</strong> ${safe(task.message)}</div>
            <div><strong>Updated:</strong> ${safe(task.updated_at)}</div>
            <div class="links"><strong>Log:</strong> ${safe(task.log)}</div>
            <div class="links"><strong>QA:</strong> ${safe(task.qa_summary)}</div>
            <div><strong>QA status:</strong> ${safe(qaState.status || "none")}</div>
            <div><strong>QA reviewed:</strong> ${safe(qaState.reviewed_at)}</div>
            <div><strong>QA pass/fail:</strong> ${safe(qaState.pass_count)} pass / ${safe(qaState.fail_count)} fail</div>
            <div><strong>QA failed scenes:</strong> ${safe((qaState.fail_scene_ranges || qaState.fail_scenes || []).join(", "))}</div>
            ${renderFailDetails(qaState.fail_details)}
            <div><strong>QA regen:</strong> ${safe(qaState.regen?.reject_dir || "")}</div>
            <div class="links"><strong>Project:</strong> ${safe(task.project)}</div>
          </div>
          <div class="actions">
            <button class="btn" onclick="requestQa('${safe(task.task).replace(/'/g, "\\'")}')">QA check</button>
            ${canRegen ? `<button class="btn warn" onclick="regenQa('${safe(task.task).replace(/'/g, "\\'")}')">Regen failed</button>` : ""}
            <button class="btn danger" onclick="endTask('${safe(task.task).replace(/'/g, "\\'")}')">End Task</button>
          </div>
        </section>
      `;
    }

    async function requestQa(taskName) {
      const ok = confirm(`Request Codex visual QA for "${taskName}"? The board will show checking. Codex heartbeat automation will pick up the request, visually review images, then write pass/fail reasons.`);
      if (!ok) return;
      try {
        const response = await fetch(`/api/tasks/${encodeURIComponent(taskName)}/qa`, { method: "POST" });
        const payload = await response.json();
        if (!response.ok || payload.errors?.length) {
          alert(`QA request failed:\n${(payload.errors || [response.statusText]).join("\n")}`);
          return;
        }
        alert(`QA checking requested. Pass threshold: ${payload.pass_threshold}%. Codex automation will pick it up and write pass/fail details.`);
        await loadBoard();
      } catch (error) {
        alert(`Failed to request QA: ${error.message}`);
      }
    }

    async function regenQa(taskName) {
      const ok = confirm(`Regenerate QA failed scenes for "${taskName}"? Failed images will be moved to a reject folder, storyboard scene images will be cleared, and the worker will resume image generation.`);
      if (!ok) return;
      try {
        const response = await fetch(`/api/tasks/${encodeURIComponent(taskName)}/qa-regen`, { method: "POST" });
        const payload = await response.json();
        if (!response.ok || payload.errors?.length) {
          alert(`Regen failed:\n${(payload.errors || [response.statusText]).join("\n")}`);
          return;
        }
        alert(`Regen queued for ${payload.scenes?.length || 0} scene(s).\nReject folder: ${payload.reject_dir || ""}`);
        await loadBoard();
      } catch (error) {
        alert(`Failed to start QA regen: ${error.message}`);
      }
    }

    async function endTask(taskName) {
      const ok = confirm(`End task "${taskName}" now? This will stop the running worker and remove its auto-resume launcher.`);
      if (!ok) return;
      try {
        const response = await fetch(`/api/tasks/${encodeURIComponent(taskName)}/end`, { method: "POST" });
        const payload = await response.json();
        if (payload.errors && payload.errors.length) {
          alert(`Task ended with warnings:\n${payload.errors.join("\n")}`);
        }
        await loadBoard();
      } catch (error) {
        alert(`Failed to end task: ${error.message}`);
      }
    }

    async function loadBoard() {
      try {
        const response = await fetch("/api/tasks");
        const payload = await response.json();
        meta.textContent = `Updated ${new Date().toLocaleTimeString()} | ${payload.tasks.length} task(s)`;
        if (!payload.tasks.length) {
          board.innerHTML = `<div class="empty">No task status found yet.</div>`;
          return;
        }
        board.innerHTML = payload.tasks.map(renderTask).join("");
      } catch (error) {
        meta.textContent = "Failed to load board";
        board.innerHTML = `<div class="empty">${error.message}</div>`;
      }
    }

    loadBoard();
    setInterval(loadBoard, 5000);
  </script>
</body>
</html>
