name: Overnight Learning

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled runs. This keeps trying every five minutes while testing.
    # Scheduler refreshed: 2026-05-22T06:22:08Z
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: overnight-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Append learning checkpoint
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/overnight_learning.py --log references/learning_sprint_log.md

      - name: Commit learning log
        run: |
          git config user.name "overnight-learning-bot"
          git config user.email "overnight-learning-bot@users.noreply.github.com"
          git add references/learning_sprint_log.md
          if git diff --cached --quiet; then
            echo "No learning log changes to commit."
          else
            git commit -m "Append overnight learning checkpoint"
            git push
          fi
